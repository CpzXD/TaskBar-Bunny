<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <title>Bunny Wardrobe</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: rgba(253, 248, 246, 0.98);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #332722;
      height: 100vh;
      display: flex;
      flex-direction: column;
      border: 3px solid #fbcfe8;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }
    /* Title bar */
    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: linear-gradient(135deg, #fdf2f8, #fce7f3);
      border-bottom: 2px solid #fbcfe8;
      -webkit-app-region: drag;
    }
    .titlebar-title {
      font-weight: 700;
      font-size: 15px;
      color: #9d174d;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .close-btn {
      -webkit-app-region: no-drag;
      background: #f43f5e;
      color: white;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s;
    }
    .close-btn:hover {
      transform: scale(1.1);
      background: #e11d48;
    }

    /* Content Area */
    .wardrobe-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }

    /* Preview Header */
    .preview-section {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 10px 14px;
      background: #fff;
      border-bottom: 2px solid #f1f5f9;
    }
    .preview-canvas-box {
      background: radial-gradient(circle, #fdf2f8 30%, #fbcfe8 100%);
      border: 2px dashed #f472b6;
      border-radius: 12px;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #previewCanvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .preview-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .bunny-name-input {
      font-size: 14px;
      font-weight: 700;
      color: #831843;
      background: #fdf2f8;
      border: 1.5px solid #f472b6;
      border-radius: 6px;
      padding: 3px 8px;
      width: 120px;
      outline: none;
      transition: all 0.15s;
    }
    .bunny-name-input:focus {
      background: #ffffff;
      border-color: #db2777;
      box-shadow: 0 0 0 2px rgba(244, 114, 182, 0.25);
    }
    .btn-name-save {
      background: #ec4899;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      transition: background 0.15s;
    }
    .btn-name-save:hover {
      background: #db2777;
    }
    .coin-display {
      background: #fef3c7;
      border: 1px solid #f59e0b;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
      color: #b45309;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .coin-icon {
      display: inline-block;
      width: 14px;
      height: 14px;
      background: radial-gradient(circle at 35% 35%, #fef08a, #eab308 60%, #ca8a04 100%);
      border: 1.5px solid #a16207;
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2), inset 0 1px 1px rgba(255,255,255,0.8);
      vertical-align: middle;
      position: relative;
      flex-shrink: 0;
    }
    .coin-icon::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 5px;
      height: 5px;
      border: 1px solid rgba(161, 98, 7, 0.6);
      border-radius: 50%;
    }

    /* Tabs */
    .tabs-bar {
      display: flex;
      background: #fdf2f8;
      border-bottom: 2px solid #fbcfe8;
      overflow-x: auto;
    }
    .tab-btn {
      padding: 8px 12px;
      border: none;
      background: transparent;
      font-size: 12px;
      font-weight: 600;
      color: #701a75;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      white-space: nowrap;
    }
    .tab-btn.active {
      color: #be185d;
      border-bottom-color: #be185d;
      background: #ffffff;
    }

    /* Tab Content Grid */
    .tab-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      align-content: start;
    }

    /* Item Card */
    .item-card {
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
      transition: all 0.15s;
    }
    .item-card.equipped {
      border-color: #10b981;
      background: #f0fdf4;
    }
    .item-card.rare {
      border-left: 4px solid #3b82f6;
    }
    .item-card.epic {
      border-left: 4px solid #a855f7;
    }
    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .item-title {
      font-size: 12px;
      font-weight: bold;
      color: #1e293b;
    }
    .item-tier {
      font-size: 9px;
      text-transform: uppercase;
      font-weight: 700;
      padding: 2px 4px;
      border-radius: 4px;
    }
    .tier-common { background: #e2e8f0; color: #475569; }
    .tier-rare { background: #dbeafe; color: #1d4ed8; }
    .tier-epic { background: #f3e8ff; color: #7e22ce; }

    .item-btn {
      padding: 4px 8px;
      border: none;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      text-align: center;
    }
    .btn-equip { background: #ec4899; color: white; }
    .btn-unequip { background: #94a3b8; color: white; }
    .btn-buy { background: #f59e0b; color: white; }
    .item-btn:hover { opacity: 0.9; }

    .item-visual-wrap {
      width: 68px;
      height: 68px;
      background: radial-gradient(circle, #fff7ed 40%, #ffedd5 100%);
      border: 1.5px solid #fed7aa;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 2px auto 6px auto;
    }
    .item-preview-canvas {
      width: 64px;
      height: 64px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Achievement Cards */
    .achievement-card {
      grid-column: span 2;
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: all 0.2s;
    }
    .achievement-card.unlocked {
      border-color: #f59e0b;
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
      box-shadow: 0 2px 6px rgba(245, 158, 11, 0.15);
    }
    .ach-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .ach-icon {
      font-size: 20px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .achievement-card.unlocked .ach-icon {
      background: #fef08a;
    }
    .ach-info {
      flex: 1;
    }
    .ach-title {
      font-size: 13px;
      font-weight: 700;
      color: #1e293b;
    }
    .ach-desc {
      font-size: 11px;
      color: #64748b;
      margin-top: 2px;
    }
    .ach-reward {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      color: #b45309;
      background: rgba(254, 243, 199, 0.7);
      padding: 4px 8px;
      border-radius: 12px;
      white-space: nowrap;
    }
    .ach-xp {
      color: #4f46e5;
      margin-left: 4px;
    }
    .ach-progress-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ach-progress-bar {
      flex: 1;
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
    }
    .ach-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #10b981);
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    .achievement-card.unlocked .ach-progress-fill {
      background: linear-gradient(90deg, #f59e0b, #10b981);
    }
    .ach-progress-text {
      font-size: 10px;
      font-weight: 600;
      color: #475569;
      min-width: 60px;
      text-align: right;
    }

    /* Base customization controls */
    .base-controls {
      grid-column: span 2;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .base-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }
    .base-row label {
      font-size: 13px;
      font-weight: 600;
    }
    select {
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 12px;
      font-weight: 500;
    }

    /* Preset bar */
    .preset-card {
      grid-column: span 2;
      background: #fff;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .preset-title {
      font-weight: bold;
      font-size: 13px;
    }
    .preset-actions {
      display: flex;
      gap: 6px;
    }
    .btn-preset {
      padding: 5px 10px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }
    .btn-save-preset { background: #3b82f6; color: white; }
    .btn-load-preset { background: #10b981; color: white; }
  </style>
</head>
<body>
  <!-- Custom Titlebar -->
  <div class="titlebar">
    <div class="titlebar-title">👗 Bunny Wardrobe & Customizer</div>
    <button class="close-btn" id="closeBtn">✕</button>
  </div>

  <div class="wardrobe-container">
    <!-- Live Preview Header -->
    <div class="preview-section">
      <div class="preview-canvas-box">
        <canvas id="previewCanvas" width="96" height="96"></canvas>
      </div>
      <div class="preview-info">
        <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
          <input type="text" id="bunnyNameInput" class="bunny-name-input" maxlength="16" value="Barnaby" placeholder="Bunny Name" title="Edit name and press Enter or Rename">
          <button id="saveNameBtn" class="btn-name-save" title="Save Bunny Name">Rename ✏️</button>
          <select id="bunnySelect" style="display: none; padding: 3px 6px; font-size: 11px; border-radius: 6px; border: 1.5px solid #f472b6; background: #fff; color: #831843; font-weight: bold; cursor: pointer;"></select>
        </div>
        <div class="coin-display"><span class="coin-icon"></span> <span id="coinCount">0</span> Coins</div>
        <div style="font-size: 11px; color: #64748b;">Live Wardrobe Preview</div>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="tabs-bar" id="tabsBar">
      <button class="tab-btn active" data-tab="base">Bunny Base</button>
      <button class="tab-btn" data-tab="head">Headwear</button>
      <button class="tab-btn" data-tab="face">Face</button>
      <button class="tab-btn" data-tab="neck">Neck</button>
      <button class="tab-btn" data-tab="back">Back</button>
      <button class="tab-btn" data-tab="held">Held Item</button>
      <button class="tab-btn" data-tab="presets">Presets</button>
      <button class="tab-btn" data-tab="achievements">🏆 Trophies</button>
    </div>

    <!-- Tab Content -->
    <div class="tab-content" id="tabContent">
      <!-- Injected dynamically by wardrobe.js -->
    </div>
  </div>

  <script src="../dist/wardrobe.js"></script>
</body>
</html>
